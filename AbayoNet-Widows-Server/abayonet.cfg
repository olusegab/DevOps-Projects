; AbayoNet configuration
; Copy this file next to abayonet.py on the server and edit the
; [database] values for your MySQL install. Env vars ABAYONET_DB_HOST /
; ABAYONET_DB_PORT / ABAYONET_DB_USER / ABAYONET_DB_PASSWORD / ABAYONET_DB_NAME
; override these if you prefer not to keep the password in a file.

[server]
port = 8080

[database]
host = localhost
port = 3306
user = abayonet
password = CHANGE_ME
name = abayonet
