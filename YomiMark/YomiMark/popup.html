<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>YomiMark</title>
<style>
body{width:400px;height:560px;display:flex;flex-direction:column;font-family:system-ui,sans-serif;font-size:13px;background:#0e0b1e;color:#f0eeff;overflow:hidden;}
.hdr{display:flex;align-items:center;gap:8px;padding:10px 12px;background:#16122a;border-bottom:1px solid #2d2850;flex-shrink:0;}
.lbox{width:28px;height:28px;border-radius:7px;background:linear-gradient(135deg,#7c6aff,#ff6ab0);display:flex;align-items:center;justify-content:center;font-weight:900;color:#fff;font-size:15px;flex-shrink:0;}
.lname{font-size:15px;font-weight:800;background:linear-gradient(135deg,#7c6aff,#ff6ab0);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.hbtns{display:flex;gap:5px;margin-left:auto;}
.ibtn{width:28px;height:28px;border-radius:7px;background:#1f1b36;border:1px solid #2d2850;color:#9b92cc;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;user-select:none;}
.ibtn:hover{background:#7c6aff;color:#fff;}
.srow{padding:8px 11px 0;flex-shrink:0;}
.sinput{width:100%;padding:7px 11px 7px 30px;background:#1f1b36;border:1px solid #2d2850;border-radius:18px;color:#f0eeff;font-size:12px;font-family:inherit;outline:none;}
.sinput:focus{border-color:#7c6aff;}
.sinput::placeholder{color:#56507a;}
.swrap{position:relative;}
.sico{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:#56507a;pointer-events:none;}
.tabs{display:flex;gap:3px;padding:7px 11px 0;flex-shrink:0;}
.tab{flex:1;padding:5px 2px;text-align:center;border-radius:7px;border:1px solid transparent;background:transparent;color:#56507a;font-size:11px;cursor:pointer;user-select:none;font-family:inherit;}
.tab:hover{background:#1f1b36;color:#9b92cc;}
.tab.on{background:#1f1b36;border-color:#7c6aff;color:#7c6aff;font-weight:600;}
#list{flex:1;overflow-y:auto;padding:6px 9px;display:flex;flex-direction:column;gap:2px;min-height:0;}
#list::-webkit-scrollbar{width:3px;}
#list::-webkit-scrollbar-thumb{background:#2d2850;border-radius:2px;}
.brow{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:8px;border:1px solid transparent;background:#1a1630;cursor:pointer;min-width:0;user-select:none;}
.brow:hover{background:#1f1b36;border-color:#7c6aff;}
.bfav{width:24px;height:24px;border-radius:5px;background:#1f1b36;border:1px solid #2d2850;display:flex;align-items:center;justify-content:center;font-size:11px;flex-shrink:0;overflow:hidden;}
.bfav img{width:14px;height:14px;display:block;}
.binfo{flex:1;min-width:0;}
.btitle{font-weight:600;font-size:12px;color:#f0eeff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.burl{font-size:10px;color:#56507a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px;}
.flabel{font-size:9px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:#56507a;padding:8px 8px 2px;}
.empty{text-align:center;padding:40px 20px;color:#56507a;}
.empty-icon{font-size:32px;margin-bottom:8px;opacity:.5;}
.empty-title{font-size:13px;font-weight:600;color:#9b92cc;margin-bottom:4px;}
.empty-sub{font-size:11px;line-height:1.5;}
.ftr{display:flex;align-items:center;gap:8px;padding:8px 11px;border-top:1px solid #2d2850;background:#16122a;flex-shrink:0;}
#stat{font-size:10px;color:#56507a;flex:1;}
#stat b{color:#7c6aff;}
.addbtn{padding:6px 13px;border-radius:18px;border:none;background:linear-gradient(135deg,#7c6aff,#ff6ab0);color:#fff;font-size:11px;font-weight:600;cursor:pointer;font-family:inherit;}
.addbtn:hover{opacity:.85;}
#tpanel{display:none;position:absolute;top:46px;right:8px;background:#16122a;border:1px solid #2d2850;border-radius:11px;padding:12px;width:215px;z-index:10;box-shadow:0 8px 24px rgba(0,0,0,.7);}
#tpanel.open{display:block;}
.tph{font-size:10px;font-weight:700;color:#9b92cc;margin-bottom:8px;text-transform:uppercase;letter-spacing:.5px;}
.tgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;}
.tsw{aspect-ratio:1;border-radius:6px;cursor:pointer;border:2px solid transparent;position:relative;overflow:hidden;user-select:none;}
.tsw:hover{outline:2px solid #fff;}
.tsw.on{border-color:#fff;}
.tsw span{position:absolute;bottom:0;left:0;right:0;font-size:6px;text-align:center;background:rgba(0,0,0,.65);color:#fff;padding:1px;}
#overlay{display:none;position:absolute;inset:0;background:rgba(0,0,0,.8);z-index:20;align-items:center;justify-content:center;}
#overlay.open{display:flex;}
.modal{background:#16122a;border:1px solid #2d2850;border-radius:13px;padding:18px;width:86%;box-shadow:0 12px 40px rgba(0,0,0,.9);}
.mh{font-size:13px;font-weight:700;margin-bottom:13px;background:linear-gradient(135deg,#7c6aff,#ff6ab0);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.modal label{display:block;font-size:10px;color:#56507a;margin-bottom:3px;text-transform:uppercase;letter-spacing:.8px;}
.modal input{width:100%;padding:7px 10px;margin-bottom:9px;background:#1f1b36;border:1px solid #2d2850;border-radius:6px;color:#f0eeff;font-size:12px;font-family:inherit;outline:none;}
.modal input:focus{border-color:#7c6aff;}
.mbtns{display:flex;gap:7px;justify-content:flex-end;margin-top:4px;}
.mbtn{padding:6px 13px;border-radius:18px;border:1px solid #2d2850;background:#1f1b36;color:#9b92cc;font-size:11px;cursor:pointer;font-family:inherit;}
.mbtn.pri{background:linear-gradient(135deg,#7c6aff,#ff6ab0);color:#fff;border:none;font-weight:600;}
#toast{position:absolute;bottom:52px;left:50%;transform:translateX(-50%) translateY(60px);background:#16122a;border:1px solid #2d2850;border-radius:18px;padding:6px 15px;font-size:11px;color:#f0eeff;z-index:30;pointer-events:none;white-space:nowrap;transition:transform .22s;}
#toast.show{transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>
<div class="hdr">
  <div class="lbox">Y</div>
  <span class="lname" style="margin-left:7px">YomiMark</span>
  <div class="hbtns">
    <div class="ibtn" id="btnSync">&#8635;</div>
    <div class="ibtn" id="btnTheme">&#9680;</div>
  </div>
</div>
<div class="srow">
  <div class="swrap">
    <span class="sico">&#128269;</span>
    <input class="sinput" id="search" placeholder="Search bookmarks..." autocomplete="off">
  </div>
</div>
<div class="tabs">
  <div class="tab on" id="tab-all">All</div>
  <div class="tab" id="tab-recent">Recent</div>
  <div class="tab" id="tab-tabs">Tabs</div>
</div>
<div id="list">
  <div class="empty">
    <div class="empty-icon">&#128278;</div>
    <div class="empty-title">Ready</div>
    <div class="empty-sub">Click the sync button &#8635; to load your bookmarks</div>
  </div>
</div>
<div class="ftr">
  <span id="stat"><b>0</b> bookmarks</span>
  <button class="addbtn" id="btnAdd">+ Add</button>
</div>
<div id="tpanel">
  <div class="tph">Choose Theme</div>
  <div class="tgrid" id="tgrid"></div>
</div>
<div id="overlay">
  <div class="modal" id="modal">
    <div class="mh">Add Bookmark</div>
    <label>Title</label>
    <input id="m-title" type="text" placeholder="Page title">
    <label>URL</label>
    <input id="m-url" type="url" placeholder="https://">
    <div class="mbtns">
      <button class="mbtn" id="btnCancel">Cancel</button>
      <button class="mbtn pri" id="btnSave">Save</button>
    </div>
  </div>
</div>
<div id="toast"></div>
<script src="popup.js"></script>
</body>
</html>
