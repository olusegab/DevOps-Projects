<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
:root{
  --ink:#1c2321;
  --paper:#f6f4ef;
  --rail:#dedacc;
  --line:#c9c4b3;
  --signal-down:#b3422f;
  --signal-down-bg:#fbe9e4;
  --signal-up:#3c6e47;
  --signal-up-bg:#e8f0e7;
  --signal-stale:#a8791f;
  --signal-stale-bg:#fbf0dc;
  --accent:#1c4f6e;
  --accent-soft:#dde8ee;
  --mono: 'Courier New', Courier, monospace;
  --serif: Georgia, 'Times New Roman', serif;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--serif);font-size:15px;}
.app{max-width:1080px;margin:0 auto;padding:28px 20px 60px;}
header.masthead{border-bottom:3px solid var(--ink);padding-bottom:14px;margin-bottom:18px;display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:8px;}
header.masthead h1{font-size:28px;margin:0;letter-spacing:0.5px;font-weight:700;}
header.masthead .tag{font-family:var(--mono);font-size:11px;color:#6b665a;text-transform:uppercase;letter-spacing:1.5px;}
.statusline{font-family:var(--mono);font-size:11px;color:#6b665a;text-align:right;}

nav.tabs{display:flex;gap:0;border-bottom:1px solid var(--line);margin-bottom:22px;flex-wrap:wrap;}
nav.tabs button{font-family:var(--mono);font-size:12px;letter-spacing:1px;text-transform:uppercase;background:none;border:none;padding:10px 16px;cursor:pointer;color:#6b665a;border-bottom:3px solid transparent;margin-bottom:-1px;}
nav.tabs button.active{color:var(--ink);border-bottom:3px solid var(--accent);font-weight:700;}
nav.tabs button .count{background:var(--signal-down);color:#fff;border-radius:10px;padding:1px 7px;font-size:10px;margin-left:6px;}

section{display:none;}
section.active{display:block;}

.search-box{display:flex;gap:8px;margin-bottom:20px;}
.search-box input{flex:1;font-family:var(--mono);font-size:14px;padding:12px 14px;border:1px solid var(--ink);background:#fff;}
.search-box button{font-family:var(--mono);font-size:12px;text-transform:uppercase;letter-spacing:1px;background:var(--ink);color:var(--paper);border:none;padding:0 18px;cursor:pointer;}
.search-box button:hover{background:var(--accent);}
.hint{font-family:var(--mono);font-size:11px;color:#8a8473;margin-bottom:14px;}

.store-card{border:1px solid var(--line);background:#fff;padding:18px 20px;margin-bottom:16px;}
.store-card .row1{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--rail);padding-bottom:10px;margin-bottom:12px;flex-wrap:wrap;gap:6px;}
.store-card h2{font-size:20px;margin:0;}
.store-card .id{font-family:var(--mono);color:#6b665a;font-size:13px;}
.badge{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:1px;padding:4px 10px;border-radius:3px;font-weight:700;display:inline-block;}
.badge.up{background:var(--signal-up-bg);color:var(--signal-up);}
.badge.down{background:var(--signal-down-bg);color:var(--signal-down);}
.badge.unknown{background:#eee;color:#888;}
.badge.stale{background:var(--signal-stale-bg);color:var(--signal-stale);margin-left:6px;}

.meta-row{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:14px;font-family:var(--mono);font-size:11px;color:#6b665a;}
.meta-row .region-edit{display:flex;align-items:center;gap:6px;}
.meta-row .region-edit input{font-family:var(--mono);font-size:11px;padding:3px 6px;border:1px solid var(--line);width:120px;}
.meta-row .uptime{font-weight:700;}

.toggle-row{display:flex;gap:10px;margin-bottom:12px;}
.toggle-row button{flex:1;font-family:var(--mono);font-size:12px;text-transform:uppercase;letter-spacing:1px;padding:9px;border:1px solid var(--line);background:#fff;cursor:pointer;}
.toggle-row button.set-up{color:var(--signal-up);}
.toggle-row button.set-up.selected{background:var(--signal-up);color:#fff;border-color:var(--signal-up);}
.toggle-row button.set-down{color:var(--signal-down);}
.toggle-row button.set-down.selected{background:var(--signal-down);color:#fff;border-color:var(--signal-down);}

.field-row{display:flex;gap:10px;margin-bottom:10px;}
.field-row > div{flex:1;}
.field-row label{display:block;font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:1px;color:#8a8473;margin-bottom:4px;}
.field-row input, .field-row select{width:100%;padding:8px;border:1px solid var(--line);font-family:var(--serif);font-size:13px;}

.comment-box textarea{width:100%;font-family:var(--serif);font-size:14px;padding:10px;border:1px solid var(--line);resize:vertical;min-height:60px;}
.comment-box{display:flex;flex-direction:column;gap:8px;}
.comment-box .btn-row{display:flex;justify-content:space-between;align-items:center;}
.comment-box .save-btn{font-family:var(--mono);font-size:12px;text-transform:uppercase;letter-spacing:1px;background:var(--accent);color:#fff;border:none;padding:8px 16px;cursor:pointer;}
.comment-box .save-btn:disabled{background:#bbb;cursor:not-allowed;}
.delete-btn{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:1px;background:none;border:1px solid var(--signal-down);color:var(--signal-down);padding:8px 14px;cursor:pointer;}
.delete-btn:hover{background:var(--signal-down);color:#fff;}

.history{margin-top:14px;border-top:1px dashed var(--rail);padding-top:10px;}
.history h4{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:1px;color:#8a8473;margin:0 0 8px;}
.history-item{font-size:13px;margin-bottom:8px;padding-left:10px;border-left:2px solid var(--rail);}
.history-item .meta{font-family:var(--mono);font-size:10px;color:#9a9686;}

.dash-summary{display:flex;gap:14px;margin-bottom:22px;flex-wrap:wrap;}
.dash-summary .stat{flex:1;min-width:120px;border:1px solid var(--ink);padding:16px;text-align:center;background:#fff;}
.dash-summary .stat .num{font-size:32px;font-weight:700;font-family:var(--mono);}
.dash-summary .stat .lbl{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:1px;color:#6b665a;margin-top:4px;}
.dash-summary .stat.down .num{color:var(--signal-down);}
.dash-summary .stat.up .num{color:var(--signal-up);}
.dash-summary .stat.stale .num{color:var(--signal-stale);}

.dash-toolbar{display:flex;justify-content:flex-end;margin-bottom:14px;}
.export-btn{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:1px;background:#fff;border:1px solid var(--ink);color:var(--ink);padding:8px 14px;cursor:pointer;}
.export-btn:hover{background:var(--ink);color:var(--paper);}

.down-card{border-left:4px solid var(--signal-down);background:#fff;border-top:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:16px 18px;margin-bottom:12px;}
.down-card .row1{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:6px;}
.down-card h3{margin:0;font-size:17px;}
.down-card .id{font-family:var(--mono);font-size:12px;color:#6b665a;}
.down-card .tags{margin-top:6px;display:flex;gap:6px;flex-wrap:wrap;}
.down-card .tag-pill{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:0.5px;background:var(--accent-soft);color:var(--accent);padding:2px 8px;border-radius:10px;}
.down-card .reason{margin-top:8px;font-size:14px;font-style:italic;}
.down-card .meta{font-family:var(--mono);font-size:10px;color:#9a9686;margin-top:6px;}
.down-card .resolve{margin-top:10px;font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:1px;background:none;border:1px solid var(--signal-up);color:var(--signal-up);padding:6px 12px;cursor:pointer;}
.empty{font-family:var(--mono);font-size:13px;color:#8a8473;text-align:center;padding:30px;border:1px dashed var(--rail);}

.add-form{background:#fff;border:1px solid var(--line);padding:20px;max-width:420px;}
.add-form label{display:block;font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:1px;color:#6b665a;margin-bottom:5px;margin-top:14px;}
.add-form input{width:100%;padding:10px;border:1px solid var(--line);font-family:var(--serif);font-size:14px;}
.add-form button{margin-top:18px;width:100%;font-family:var(--mono);font-size:12px;text-transform:uppercase;letter-spacing:1px;background:var(--ink);color:var(--paper);border:none;padding:12px;cursor:pointer;}
.add-form .msg{font-family:var(--mono);font-size:12px;margin-top:10px;}
.add-form .msg.ok{color:var(--signal-up);}
.add-form .msg.err{color:var(--signal-down);}

.bulk-form{background:#fff;border:1px solid var(--line);padding:20px;max-width:600px;}
.bulk-form textarea{width:100%;min-height:120px;font-family:var(--mono);font-size:12px;padding:10px;border:1px solid var(--line);}
.bulk-form button{margin-top:12px;font-family:var(--mono);font-size:12px;text-transform:uppercase;letter-spacing:1px;background:var(--ink);color:var(--paper);border:none;padding:10px 18px;cursor:pointer;}

.toolbar{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;align-items:center;}
.toolbar input, .toolbar select{font-family:var(--mono);font-size:12px;padding:8px 10px;border:1px solid var(--line);}
.toolbar input{flex:1;min-width:160px;}

.list-table{width:100%;border-collapse:collapse;background:#fff;}
.list-table th{text-align:left;font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:1px;color:#6b665a;border-bottom:2px solid var(--ink);padding:8px 10px;cursor:pointer;}
.list-table td{padding:9px 10px;border-bottom:1px solid var(--rail);font-size:13px;}
.list-table tr:hover{background:var(--accent-soft);cursor:pointer;}
</style>
</head>
<body>
<div class="app">
  <header class="masthead">
    <div>
      <h1>Store Watch</h1>
      <div class="tag">Branch Status Register</div>
    </div>
    <div class="statusline" id="lastUpdated">loading…</div>
  </header>

  <nav class="tabs">
    <button data-tab="search" class="active">Search</button>
    <button data-tab="dashboard">Dashboard <span class="count" id="downCount" style="display:none;"></span></button>
    <button data-tab="all">All Stores</button>
    <button data-tab="add">Add Store</button>
    <button data-tab="bulk">Bulk Import</button>
  </nav>

  <section id="tab-search" class="active">
    <div class="search-box">
      <input id="searchInput" placeholder="Enter store ID or name, e.g. 51829 or Jabi Mall" autocomplete="off">
      <button id="searchBtn">Search</button>
    </div>
    <div class="hint">Search by store ID number or store name.</div>
    <div id="searchResult"></div>
  </section>

  <section id="tab-dashboard">
    <div class="dash-summary">
      <div class="stat down"><div class="num" id="statDown">0</div><div class="lbl">Currently Down</div></div>
      <div class="stat up"><div class="num" id="statUp">0</div><div class="lbl">Confirmed Up</div></div>
      <div class="stat stale"><div class="num" id="statStale">0</div><div class="lbl">Not Checked &gt;7d</div></div>
      <div class="stat"><div class="num" id="statTotal">0</div><div class="lbl">Total Stores</div></div>
    </div>
    <div class="dash-toolbar">
      <button class="export-btn" id="exportDownBtn">Export Down List (CSV)</button>
    </div>
    <div id="dashList"></div>
  </section>

  <section id="tab-all">
    <div class="toolbar">
      <input id="filterInput" placeholder="Filter by name, ID, or region...">
      <select id="filterStatus">
        <option value="">All statuses</option>
        <option value="up">Online</option>
        <option value="down">Down</option>
        <option value="unknown">Unknown</option>
      </select>
      <select id="sortBy">
        <option value="name">Sort: Name</option>
        <option value="id">Sort: Store ID</option>
        <option value="status">Sort: Status</option>
        <option value="region">Sort: Region</option>
        <option value="uptime">Sort: Uptime %</option>
      </select>
      <button class="export-btn" id="exportAllBtn">Export All (CSV)</button>
    </div>
    <table class="list-table">
      <thead><tr><th>Store ID</th><th>Name</th><th>Region</th><th>Status</th><th>Uptime</th></tr></thead>
      <tbody id="allStoresBody"></tbody>
    </table>
  </section>

  <section id="tab-add">
    <div class="add-form">
      <label>Store ID</label>
      <input id="newId" placeholder="e.g. 51999">
      <label>Store Name</label>
      <input id="newName" placeholder="e.g. New Branch">
      <label>Region (optional)</label>
      <input id="newRegion" placeholder="e.g. Abuja, Lagos, PH...">
      <button id="addBtn">Add Store</button>
      <div class="msg" id="addMsg"></div>
    </div>
  </section>

  <section id="tab-bulk">
    <div class="bulk-form">
      <div class="hint" style="margin-bottom:10px;">Paste store entries in the format: Name (#ID), Name (#ID), ... Existing IDs will be skipped.</div>
      <textarea id="bulkText" placeholder="e.g. New Branch (#52001), Another Branch (#52002)"></textarea>
      <button id="bulkBtn">Import Stores</button>
      <div class="msg" id="bulkMsg" style="font-family:var(--mono);font-size:12px;margin-top:10px;"></div>
    </div>
  </section>
</div>

<script>
const RAW_STORES = `Jabi Mall (#51829), GWARINPA (#51806), WUSE II (#51803), GARKI (#51821), Gateway Mall (#51830), Apo Mall (#51832), GADO NASKO WAY (#51834), Nyanya (#51852), Minna (#51855), Barnawa (#51854), Ali Akilu (#51856), Jos (#51860), Polo Park (#51833), Akure Mall (#51835), Awka (#51857), Kwara Mall (#51836), Asaba (#51843), Onitsha (#51866), Bompai (#51848), Benin - Ugbowo (#51845), Benin-Sapele (#51844), New Owerri (#51858), New Owerri (#51858), Warri (#51849), Akobo (#51863), BODIJA (#51798), RING ROAD (#51795), Orita Challenge (#51851), Aba (#51847), Uyo (#51841), Calabar (#51837), Choba (#51853), Shell Road (#51838), Yenagoa (#51861), GRA - PH (#51827), Peter-Odili (#51842), Abiola Way (#51862), Awoyaya (#51868), ABEOKUTA (#51823), SANGOTEDO (#51815), Sawmill - Ikorodu (#51865), Badore (#51840), IKORODU (#51817), CHEVRON (#51805), Ikota (#51867), Prime Mall (#51869), AGUNGI (#51796), JAKANDE (#51824), MAGODO (#51804), OGUDU GRA (#51809), Freedom-Way (#51870), ADMIRALTY (#51791), AGIDINGBI (#51808), GBAGADA (#51802), AROMIRE (#51811), ADMIRALTY 2 (#51812), IJU (#51820), TOYIN (#51792), OGUNNAIKE (#51793), MARYLAND (#51822), OKO OBA (#51819), Jara Mall (#51839), AJOSE (#51801), ILUPEJU (#51816), IKOYI (#51826), YABA (#51807), EGBEDA (#51814), SAKA (#51790), OTA (#51825), Itire (#51831), AJAO (#51800), SURULERE (#51799), IDIMU ROAD (#51818), APAPA (#51794), IKOTUN (#51810), FESTAC (#51797), SATELITE (#51828), Lasu (#51864)`;

const STALE_DAYS = 7;

function parseSeed(raw){
  const seen = {};
  const out = [];
  raw.split(',').forEach(chunk => {
    const m = chunk.match(/(.+?)\s*\(#(\d+)\)/);
    if(!m) return;
    const name = m[1].trim();
    const id = m[2].trim();
    if(seen[id]) return;
    seen[id] = true;
    out.push({id, name});
  });
  return out;
}

function parseBulk(raw){
  return parseSeed(raw);
}

let stores = []; // {id, name, region, status, comments:[{text,status,ts,reportedBy,severity}]}
let activeTab = 'search';

async function loadData(){
  let saved = null;
  try{
    const r = await window.storage.get('stores-data');
    if(r && r.value) saved = JSON.parse(r.value);
  }catch(e){ saved = null; }

  if(saved && Array.isArray(saved) && saved.length){
    stores = saved.map(s => ({region:'', ...s}));
  } else {
    const seed = parseSeed(RAW_STORES);
    stores = seed.map(s => ({id: s.id, name: s.name, region:'', status: 'unknown', comments: []}));
    await persist();
  }
  renderAll();
}

async function persist(){
  try{
    await window.storage.set('stores-data', JSON.stringify(stores));
  }catch(e){ console.error('save failed', e); }
  document.getElementById('lastUpdated').textContent = 'Saved ' + new Date().toLocaleString();
}

function findById(id){
  const clean = id.replace('#','').trim();
  return stores.find(s => s.id === clean);
}

function findByQuery(q){
  const clean = q.replace('#','').trim().toLowerCase();
  return stores.find(s => s.id === clean) ||
         stores.find(s => s.name.toLowerCase() === clean) ||
         stores.find(s => s.name.toLowerCase().includes(clean));
}

function lastCommentTs(store){
  if(!store.comments.length) return null;
  return store.comments[store.comments.length-1].ts;
}

function isStale(store){
  const ts = lastCommentTs(store);
  if(!ts) return true;
  const days = (Date.now() - ts) / (1000*60*60*24);
  return days > STALE_DAYS;
}

function formatDuration(ms){
  const mins = Math.floor(ms/60000);
  const days = Math.floor(mins/1440);
  const hrs = Math.floor((mins%1440)/60);
  const m = mins%60;
  let parts = [];
  if(days) parts.push(days+'d');
  if(hrs) parts.push(hrs+'h');
  if(!days && m) parts.push(m+'m');
  return parts.length ? parts.join(' ') : '<1m';
}

function downSince(store){
  // find ts when it most recently flipped to down
  for(let i=store.comments.length-1;i>=0;i--){
    if(store.comments[i].status==='down'){
      // check it's the current run (no 'up' after it) -- since store.status is down, last entry should be down
      return store.comments[i].ts;
    } else break;
  }
  return null;
}

function calcUptime(store){
  if(!store.comments.length) return null;
  const sorted = store.comments.slice().sort((a,b)=>a.ts-b.ts);
  let upMs = 0, totalMs = 0;
  for(let i=0;i<sorted.length;i++){
    const start = sorted[i].ts;
    const end = i+1 < sorted.length ? sorted[i+1].ts : Date.now();
    const dur = Math.max(0, end-start);
    totalMs += dur;
    if(sorted[i].status === 'up') upMs += dur;
  }
  if(totalMs === 0) return null;
  return Math.round((upMs/totalMs)*100);
}

// TABS
document.querySelectorAll('nav.tabs button').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('nav.tabs button').forEach(b=>b.classList.remove('active'));
    document.querySelectorAll('section').forEach(s=>s.classList.remove('active'));
    btn.classList.add('active');
    activeTab = btn.dataset.tab;
    document.getElementById('tab-'+activeTab).classList.add('active');
    if(activeTab==='dashboard') renderDashboard();
    if(activeTab==='all') renderAllList();
  });
});

// SEARCH
function doSearch(){
  const val = document.getElementById('searchInput').value.trim();
  const resultEl = document.getElementById('searchResult');
  if(!val){ resultEl.innerHTML = ''; return; }
  const store = findByQuery(val);
  if(!store){
    resultEl.innerHTML = `<div class="empty">No store found matching "${escapeHtml(val)}". Check the ID/name or add it under "Add Store".</div>`;
    return;
  }
  renderStoreCard(store, resultEl);
}
document.getElementById('searchBtn').addEventListener('click', doSearch);
document.getElementById('searchInput').addEventListener('keydown', e=>{ if(e.key==='Enter') doSearch(); });

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

const SEVERITY_OPTIONS = ['Power','Network/Internet','POS/System','Connectivity Provider','Other'];

function renderStoreCard(store, container){
  const badgeClass = store.status === 'up' ? 'up' : store.status === 'down' ? 'down' : 'unknown';
  const badgeText = store.status === 'up' ? 'Online' : store.status === 'down' ? 'Down' : 'Unknown';
  const stale = isStale(store);
  const uptime = calcUptime(store);

  const historyHtml = store.comments.length
    ? store.comments.slice().reverse().map(c => `
        <div class="history-item">
          <div class="meta">${c.status === 'down' ? 'DOWN' : 'UP'} · ${new Date(c.ts).toLocaleString()}${c.reportedBy ? ' · by '+escapeHtml(c.reportedBy) : ''}${c.severity ? ' · '+escapeHtml(c.severity) : ''}</div>
          <div>${escapeHtml(c.text || '(no comment)')}</div>
        </div>`).join('')
    : '<div class="history-item">No comments yet.</div>';

  container.innerHTML = `
    <div class="store-card">
      <div class="row1">
        <h2>${escapeHtml(store.name)}</h2>
        <div class="id">#${store.id}</div>
      </div>
      <div style="margin-bottom:10px;">
        <span class="badge ${badgeClass}">${badgeText}</span>
        ${stale ? '<span class="badge stale">Not checked &gt;7d</span>' : ''}
      </div>
      <div class="meta-row">
        <div class="region-edit">
          <span>REGION:</span>
          <input id="regionInput" value="${escapeHtml(store.region||'')}" placeholder="unassigned">
        </div>
        ${uptime !== null ? `<div class="uptime">UPTIME: ${uptime}%</div>` : ''}
      </div>
      <div class="toggle-row">
        <button class="set-up ${store.status==='up' ? 'selected':''}" data-action="up">Mark Online</button>
        <button class="set-down ${store.status==='down' ? 'selected':''}" data-action="down">Mark Down</button>
      </div>
      <div class="field-row" id="severityRow" style="display:${store.status==='down' ? 'flex':'none'};">
        <div>
          <label>Cause / Severity</label>
          <select id="severitySelect">
            <option value="">Select cause...</option>
            ${SEVERITY_OPTIONS.map(o=>`<option value="${o}">${o}</option>`).join('')}
          </select>
        </div>
        <div>
          <label>Reported by</label>
          <input id="reportedByInput" placeholder="Your name">
        </div>
      </div>
      <div class="comment-box">
        <textarea id="commentText" placeholder="${store.status==='down' ? 'Reason store is down...' : 'Optional comment...'}"></textarea>
        <div class="btn-row">
          <button class="delete-btn" id="deleteStoreBtn">Delete Store</button>
          <button class="save-btn" id="saveCommentBtn">Save Update</button>
        </div>
      </div>
      <div class="history">
        <h4>History</h4>
        ${historyHtml}
      </div>
    </div>
  `;

  let pendingStatus = store.status === 'down' ? 'down' : store.status === 'up' ? 'up' : null;

  container.querySelector('#regionInput').addEventListener('change', async (e)=>{
    store.region = e.target.value.trim();
    await persist();
    renderAllList();
  });

  container.querySelectorAll('.toggle-row button').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      pendingStatus = btn.dataset.action;
      container.querySelectorAll('.toggle-row button').forEach(b=>b.classList.remove('selected'));
      btn.classList.add('selected');
      const ta = container.querySelector('#commentText');
      ta.placeholder = pendingStatus === 'down' ? 'Reason store is down...' : 'Optional comment...';
      container.querySelector('#severityRow').style.display = pendingStatus === 'down' ? 'flex' : 'none';
    });
  });

  container.querySelector('#saveCommentBtn').addEventListener('click', async ()=>{
    if(!pendingStatus){
      alert('Choose "Mark Online" or "Mark Down" first.');
      return;
    }
    const text = container.querySelector('#commentText').value.trim();
    const severity = pendingStatus === 'down' ? container.querySelector('#severitySelect').value : '';
    const reportedBy = container.querySelector('#reportedByInput') ? container.querySelector('#reportedByInput').value.trim() : '';
    store.status = pendingStatus;
    store.comments.push({text, status: pendingStatus, ts: Date.now(), severity, reportedBy});
    await persist();
    renderStoreCard(store, container);
    renderAllList();
  });

  container.querySelector('#deleteStoreBtn').addEventListener('click', async ()=>{
    if(!confirm(`Delete "${store.name}" (#${store.id})? This cannot be undone.`)) return;
    stores = stores.filter(s => s.id !== store.id);
    await persist();
    container.innerHTML = `<div class="empty">Store #${store.id} deleted.</div>`;
    renderAllList();
    renderDashboard();
  });
}

// DASHBOARD
function renderDashboard(){
  const downStores = stores.filter(s => s.status === 'down');
  const upStores = stores.filter(s => s.status === 'up');
  const staleStores = stores.filter(isStale);
  document.getElementById('statDown').textContent = downStores.length;
  document.getElementById('statUp').textContent = upStores.length;
  document.getElementById('statStale').textContent = staleStores.length;
  document.getElementById('statTotal').textContent = stores.length;

  const countBadge = document.getElementById('downCount');
  if(downStores.length > 0){
    countBadge.style.display = 'inline';
    countBadge.textContent = downStores.length;
  } else {
    countBadge.style.display = 'none';
  }

  const listEl = document.getElementById('dashList');
  if(downStores.length === 0){
    listEl.innerHTML = '<div class="empty">No stores currently flagged down. All clear.</div>';
    return;
  }

  listEl.innerHTML = downStores.map(s => {
    const lastComment = s.comments.slice().reverse().find(c => c.status === 'down');
    const since = downSince(s);
    return `
      <div class="down-card" data-id="${s.id}">
        <div class="row1">
          <h3>${escapeHtml(s.name)}</h3>
          <div class="id">#${s.id}${s.region ? ' · '+escapeHtml(s.region) : ''}</div>
        </div>
        <div class="tags">
          ${since ? `<span class="tag-pill">Down ${formatDuration(Date.now()-since)}</span>` : ''}
          ${lastComment && lastComment.severity ? `<span class="tag-pill">${escapeHtml(lastComment.severity)}</span>` : ''}
          ${lastComment && lastComment.reportedBy ? `<span class="tag-pill">Reported by ${escapeHtml(lastComment.reportedBy)}</span>` : ''}
        </div>
        <div class="reason">${lastComment ? escapeHtml(lastComment.text || '(no reason given)') : '(no reason given)'}</div>
        <div class="meta">${lastComment ? 'Flagged ' + new Date(lastComment.ts).toLocaleString() : ''}</div>
        <button class="resolve" data-id="${s.id}">Mark Online</button>
      </div>
    `;
  }).join('');

  listEl.querySelectorAll('.resolve').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const store = findById(btn.dataset.id);
      store.status = 'up';
      store.comments.push({text:'Resolved from dashboard', status:'up', ts: Date.now()});
      await persist();
      renderDashboard();
      renderAllList();
    });
  });
}

function downloadCsv(filename, rows){
  const csv = rows.map(r => r.map(cell => `"${String(cell).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob([csv], {type:'text/csv'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

document.getElementById('exportDownBtn').addEventListener('click', ()=>{
  const downStores = stores.filter(s => s.status === 'down');
  const rows = [['Store ID','Name','Region','Down Since','Severity','Reported By','Reason']];
  downStores.forEach(s=>{
    const lastComment = s.comments.slice().reverse().find(c => c.status === 'down');
    const since = downSince(s);
    rows.push([s.id, s.name, s.region||'', since ? new Date(since).toLocaleString() : '', lastComment?.severity||'', lastComment?.reportedBy||'', lastComment?.text||'']);
  });
  downloadCsv('stores-down.csv', rows);
});

// ALL STORES LIST
let sortState = 'name';
function renderAllList(){
  const filterVal = (document.getElementById('filterInput').value||'').toLowerCase();
  const statusVal = document.getElementById('filterStatus').value;
  sortState = document.getElementById('sortBy').value;

  let filtered = stores.filter(s=>{
    const matchesText = !filterVal || s.name.toLowerCase().includes(filterVal) || s.id.includes(filterVal) || (s.region||'').toLowerCase().includes(filterVal);
    const matchesStatus = !statusVal || s.status === statusVal;
    return matchesText && matchesStatus;
  });

  filtered.sort((a,b)=>{
    if(sortState==='name') return a.name.localeCompare(b.name);
    if(sortState==='id') return Number(a.id)-Number(b.id);
    if(sortState==='status') return a.status.localeCompare(b.status);
    if(sortState==='region') return (a.region||'').localeCompare(b.region||'');
    if(sortState==='uptime') return (calcUptime(b)||0)-(calcUptime(a)||0);
    return 0;
  });

  const body = document.getElementById('allStoresBody');
  body.innerHTML = filtered.map(s=>{
    const badgeClass = s.status === 'up' ? 'up' : s.status === 'down' ? 'down' : 'unknown';
    const badgeText = s.status === 'up' ? 'Online' : s.status === 'down' ? 'Down' : 'Unknown';
    const uptime = calcUptime(s);
    return `<tr data-id="${s.id}">
      <td>#${s.id}</td>
      <td>${escapeHtml(s.name)}</td>
      <td>${escapeHtml(s.region||'—')}</td>
      <td><span class="badge ${badgeClass}">${badgeText}</span>${isStale(s) ? ' <span class="badge stale">stale</span>' : ''}</td>
      <td>${uptime !== null ? uptime+'%' : '—'}</td>
    </tr>`;
  }).join('') || '<tr><td colspan="5" style="text-align:center;padding:20px;font-family:var(--mono);color:#8a8473;">No stores match.</td></tr>';

  body.querySelectorAll('tr[data-id]').forEach(row=>{
    row.addEventListener('click', ()=>{
      document.querySelectorAll('nav.tabs button').forEach(b=>b.classList.remove('active'));
      document.querySelectorAll('section').forEach(s=>s.classList.remove('active'));
      document.querySelector('[data-tab="search"]').classList.add('active');
      document.getElementById('tab-search').classList.add('active');
      document.getElementById('searchInput').value = row.dataset.id;
      doSearch();
    });
  });
}
document.getElementById('filterInput').addEventListener('input', renderAllList);
document.getElementById('filterStatus').addEventListener('change', renderAllList);
document.getElementById('sortBy').addEventListener('change', renderAllList);

document.getElementById('exportAllBtn').addEventListener('click', ()=>{
  const rows = [['Store ID','Name','Region','Status','Uptime %']];
  stores.forEach(s=>{
    rows.push([s.id, s.name, s.region||'', s.status, calcUptime(s) !== null ? calcUptime(s) : '']);
  });
  downloadCsv('stores-all.csv', rows);
});

// ADD STORE
document.getElementById('addBtn').addEventListener('click', async ()=>{
  const idInput = document.getElementById('newId');
  const nameInput = document.getElementById('newName');
  const regionInput = document.getElementById('newRegion');
  const msg = document.getElementById('addMsg');
  const id = idInput.value.replace('#','').trim();
  const name = nameInput.value.trim();
  const region = regionInput.value.trim();

  if(!id || !name){
    msg.textContent = 'Enter both a store ID and a name.';
    msg.className = 'msg err';
    return;
  }
  if(findById(id)){
    msg.textContent = `Store ID #${id} already exists.`;
    msg.className = 'msg err';
    return;
  }
  stores.push({id, name, region, status:'unknown', comments:[]});
  await persist();
  msg.textContent = `Added "${name}" (#${id}).`;
  msg.className = 'msg ok';
  idInput.value = ''; nameInput.value = ''; regionInput.value = '';
  renderAllList();
});

// BULK IMPORT
document.getElementById('bulkBtn').addEventListener('click', async ()=>{
  const text = document.getElementById('bulkText').value;
  const msg = document.getElementById('bulkMsg');
  if(!text.trim()){
    msg.textContent = 'Paste store entries first.';
    msg.className = 'msg err';
    return;
  }
  const parsed = parseBulk(text);
  if(!parsed.length){
    msg.textContent = 'No valid entries found. Use the format: Name (#ID), Name (#ID)';
    msg.className = 'msg err';
    return;
  }
  let added = 0, skipped = 0;
  parsed.forEach(p=>{
    if(findById(p.id)){ skipped++; return; }
    stores.push({id:p.id, name:p.name, region:'', status:'unknown', comments:[]});
    added++;
  });
  await persist();
  msg.textContent = `Imported ${added} new store(s). Skipped ${skipped} duplicate(s).`;
  msg.className = 'msg ok';
  document.getElementById('bulkText').value = '';
  renderAllList();
  renderDashboard();
});

function renderAll(){
  renderDashboard();
  renderAllList();
}

loadData();
</script>
